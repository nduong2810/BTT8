<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>List Categories</title>
	<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
	<style>
		.pagination a.active {
			font-weight: bold;
			color: white;
			background-color: #0d6efd;
			border-radius: 5px;
			padding: 5px 10px;
			margin: 0 3px;
		}
	</style>
</head>

<body class="container mt-4">

	<h3 class="mb-3">List Category</h3>

	<!-- Search and Add New -->
	<form class="row mb-3" th:action="@{/admin/categories/searchpaginated}" method="get">
		<div class="col-md-4">
			<input type="text" name="name" class="form-control" placeholder="Nhập từ khóa để tìm" th:value="${name}">
		</div>
		<div class="col-md-2">
			<button class="btn btn-primary" type="submit">Search</button>
		</div>
		<div class="col-md-3">
			<a class="btn btn-success" th:href="@{/admin/categories/add}">Add New Category</a>
		</div>
	</form>

	<!-- Table -->
	<table class="table table-bordered table-hover">
		<thead class="table-dark">
			<tr>
				<th>Category ID</th>
				<th>Category Name</th>
				<th>Action</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="item : ${categoryPage.content}">
				<td th:text="${item.categoryId}"></td>
				<td th:text="${item.name}"></td>
				<td>
					<a class="btn btn-warning btn-sm"
						th:href="@{'/admin/categories/edit/' + ${item.categoryId}}">Edit</a>
					<a class="btn btn-danger btn-sm" th:href="@{'/admin/categories/delete/' + ${item.categoryId}}"
						onclick="return confirm('Are you sure?')">Delete</a>
				</td>
			</tr>
		</tbody>
	</table>

	<!-- Page Size -->
	<form th:action="@{/admin/categories/searchpaginated}" method="get" class="mb-3">
		<input type="hidden" name="name" th:value="${name}">
		<label>Page size:</label>
		<select name="size" onchange="this.form.submit()">
			<option th:selected="${categoryPage.size == 5}" value="5">5</option>
			<option th:selected="${categoryPage.size == 10}" value="10">10</option>
			<option th:selected="${categoryPage.size == 20}" value="20">20</option>
		</select>
	</form>

	<!-- Page Numbers -->
	<div class="pagination">
		<span th:each="pageNum : ${pageNumbers}">
			<a th:href="@{|/admin/categories/searchpaginated?page=${pageNum}&size=${categoryPage.size}&name=${name}|}"
				th:text="${pageNum}" th:classappend="${pageNum == categoryPage.number + 1} ? 'active' : ''"></a>
		</span>
	</div>

</body>

</html>
