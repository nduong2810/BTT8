<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{admin/layout-admin.html}">

<section class="row" layout:fragment="content">
	<div class="col mt-4">
		<div class="card">
			<div class="card-header">List Category</div>
			<div class="card-body">

				<!-- Thông báo -->
				<div th:if="${message != null}" class="alert alert-primary" role="alert">
					<i th:text="${message}"></i>
				</div>

				<!-- Bảng danh sách -->
				<table class="table table-striped table-responsive">
					<thead class="table-dark">
						<tr>
							<th>Category ID</th>
							<th>Category Name</th>
							<th>Action</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="category : ${categoryPage != null ? categoryPage.content : categories}">
							<td th:text="${category.categoryId}"></td>
							<td th:text="${category.name}"></td>
							<td>
								<a th:href="@{'/admin/categories/edit/' + ${category.categoryId}}"
									class="btn btn-outline-warning btn-sm">
									<i class="fa fa-edit"></i>
								</a>
								<a th:href="@{'/admin/categories/delete/' + ${category.categoryId}}"
									class="btn btn-outline-danger btn-sm"
									onclick="return confirm('Bạn có chắc chắn muốn xoá không?');">
									<i class="fa fa-trash"></i>
								</a>
							</td>
						</tr>
					</tbody>
				</table>

				<!-- Phân trang -->
				<nav th:if="${pageNumbers != null}">
					<ul class="pagination justify-content-center">
						<li class="page-item" th:classappend="${categoryPage.first} ? 'disabled'">
							<a class="page-link"
								th:href="@{'/admin/categories/searchpaginated?(name=${name}, page=' + ${categoryPage.number} + ', size=' + ${categoryPage.size})}">Previous</a>
						</li>

						<li class="page-item" th:each="pageNum : ${pageNumbers}"
							th:classappend="${pageNum == categoryPage.number + 1} ? 'active'">
							<a class="page-link"
								th:href="@{'/admin/categories/searchpaginated?(name=${name}, page=' + ${pageNum} + ', size=' + ${categoryPage.size})}"
								th:text="${pageNum}">1</a>
						</li>

						<li class="page-item" th:classappend="${categoryPage.last} ? 'disabled'">
							<a class="page-link"
								th:href="@{'/admin/categories/searchpaginated?(name=${name}, page=' + ${categoryPage.number + 2} + ', size=' + ${categoryPage.size})}">Next</a>
						</li>
					</ul>
				</nav>

			</div>
		</div>
	</div>
</section>

</html>
